# Build, certify and (optionally) upload the HarvestBench Coworld.
#
# The Coworld toolchain needs Docker for build and certification, which the
# lab machine does not have, so this runs on a GitHub runner. Upload needs a
# Softmax user credential in the SOFTMAX_TOKEN repository secret (from
# `softmax get-token` on a logged-in machine); the first upload of the
# `harvestbench` game name fixes its owner to that account.
name: coworld

on:
  pull_request:
    paths:
      - "coworld/**"
      - "harvest/**"
      - "tests/**"
      - ".github/workflows/coworld.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Coworld version to write into the manifest (e.g. 0.1.0)"
        required: true
        default: "0.2.0"
      upload:
        description: "Upload to Softmax after certification"
        type: boolean
        default: true

jobs:
  coworld:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # coworld build pins source_url to the current commit

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install the Coworld and Softmax CLIs
        run: |
          uv venv .coworld-tools --python 3.12
          uv pip install --python .coworld-tools/bin/python coworld==0.1.47
          echo "$GITHUB_WORKSPACE/.coworld-tools/bin" >> "$GITHUB_PATH"

      - name: Build
        run: coworld build --project coworld --version "${{ inputs.version || '0.2.0' }}"

      - name: Test the game-owned soul runtime
        run: |
          docker build -f coworld/Dockerfile.test -t harvestbench-coworld-test .
          docker run --rm --network none --cpus 2 --memory 2g harvestbench-coworld-test

      - name: Verify cold and cached upload preflight (no publication)
        run: python coworld/tools/release.py coworld/dist/coworld_manifest.json --check-upload-preflight

      - name: Keep the built manifest and certification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coworld-${{ inputs.version || '0.2.0' }}
          path: |
            coworld/dist/
            tmp/coworld-cert-*/
          if-no-files-found: warn

      - name: Upload to Softmax
        if: ${{ inputs.upload }}
        env:
          SOFTMAX_TOKEN: ${{ secrets.SOFTMAX_TOKEN }}
        run: |
          test -n "$SOFTMAX_TOKEN" || { echo "SOFTMAX_TOKEN secret is not set"; exit 1; }
          softmax set-token "$SOFTMAX_TOKEN"
          softmax status
          python coworld/tools/release.py coworld/dist/coworld_manifest.json --upload
