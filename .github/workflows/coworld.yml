name: HarvestBench PW
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: treeform/setup-nim-action@v6
      - name: Install browser compiler and Python runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y emscripten
          uv venv --python 3.12
          uv pip install -e . pytest fastapi==0.115.5 uvicorn==0.34.2 websockets==15.0.1 httpx==0.28.1 pydantic==2.13.5
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Build the shared Polyworld viewer
        run: coworld/tools/build_replay_viewer.sh "$PWD/coworld/build/static-replay-viewer"
      - name: Replay restoration and gameplay tests
        run: |
          nim r -o:tmp/test_harvest_replay tests/test_harvest_replay.nim
          python scripts/demo_polyworld.py
          python -m pytest -q
      - name: Build the game image
        run: docker build -f coworld/Dockerfile -t harvestbench-pw:test .
      - name: Keep runnable viewer and sample episode
        uses: actions/upload-artifact@v4
        with:
          name: harvestbench-pw-viewer
          path: |
            coworld/build/static-replay-viewer/
            tmp/demo/
